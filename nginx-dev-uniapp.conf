# Nginx 开发环境配置（包含 UniApp）
# 适用于：Vue 管理端 + UniApp H5 开发服务器，后端通过 Nginx 代理
# 访问地址：
#   - Vue 管理端：http://localhost
#   - UniApp H5：http://localhost/uniapp

server {
    listen 80;
    server_name localhost;

    # 字符编码
    charset utf-8;

    # Vue 管理端代理（Vite 开发服务器）
    # 访问 http://localhost/ 时，转发到 Vue 管理端
    location / {
        proxy_pass http://localhost:3000;
        
        # WebSocket 支持（Vite HMR 热更新需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 代理请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用缓冲
        proxy_buffering off;
    }

    # UniApp H5 开发服务器代理
    # 访问 http://localhost/uniapp 时，转发到 UniApp H5 开发服务器
    location /uniapp {
        proxy_pass http://localhost:5173;
        
        # WebSocket 支持（Vite HMR 热更新需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 代理请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 路径重写：移除 /uniapp 前缀
        rewrite ^/uniapp/(.*)$ /$1 break;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用缓冲
        proxy_buffering off;
    }

    # 后端 API 代理（统一处理）
    # 所有 /api 请求转发到 Spring Boot 后端
    # 无论是从 Vue 管理端还是 UniApp 发起的请求
    location /api {
        proxy_pass http://localhost:8080;
        
        # 代理请求头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # 禁用缓冲
        proxy_buffering off;
    }

    # 错误日志
    error_log logs/nginx-dev-error.log;
    access_log logs/nginx-dev-access.log;
}

